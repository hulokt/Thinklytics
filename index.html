    <script>
      // Decode GitHub Pages SPA query format "?/<path>&..." back to a real path
      // When 404.html redirects, it creates URLs like: https://thinklytics.org/?/questions
      // l.search would be "?/questions", so we check for "?/" at position 0
      (function(){
        var l = window.location;
        // Check if the search starts with "?/" (encoded path from 404.html)
        if (l.search && l.search.substring(0, 2) === '?/') {
          var rest = l.search.slice(2); // strip "?/"
          var parts = rest.split('&');
          var path = parts.shift();
          var qs = parts.length ? ('?' + parts.join('&').replace(/~and~/g,'&')) : '';
          var newUrl = l.protocol + '//' + l.host + '/' + path + qs + l.hash;
          console.error('[SPA_REDIRECT] Decoded path from:', l.search, 'to:', '/' + path);
          window.history.replaceState(null, '', newUrl);
        }
      })();
    </script>
